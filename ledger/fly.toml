# Fly app names are global; change this if it is taken.
app = "cobol-demos-ledger"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/cgi-bin/ledger"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
